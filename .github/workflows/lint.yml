name: Format + Lint

on:
  pull_request:
    branches:
      - staging
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "!cmd/migrations/**"

jobs:
  setup:
    name: Setup & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22.0"

      - name: Show Go version
        run: go version

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check formatting with gofumpt
        run: gofumpt -l -w ./.

  lint:
    name: GolangCI Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=10m
          install-mode: binary
          skip-cache: false
          skip-save-cache: false
          cache-invalidation-interval: 7

