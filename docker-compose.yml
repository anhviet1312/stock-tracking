version: "3.8"
services:
  stw_core:
    container_name: core
    env_file:
      - ./.env
    networks:
      - stock
    depends_on:
      - redis
      - postgres
    build:
      context: ./
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"

  postgres:
    container_name: stw_postgres
    image: postgres:16-alpine
    shm_size: 4g
    networks:
      - stock
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    # volumes:
    #   - ./pgdata/production/data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 2s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    container_name: stw_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./redisdata:/data
    restart: unless-stopped
    networks:
      - stock
    command: [ "redis-server", "--appendonly", "yes" ]
    ulimits:
      nproc: 65535
      nofile:
        soft: 10000
        hard: 20000

networks:
  stock:
    name: stock
